name: Update Contributor Stats

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate contributor stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_FORKS: 50
        run: node .github/scripts/update-contributors.cjs

      - name: Open or update contributor stats pull request
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet README.md; then
            echo "No README changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="automation/update-contributor-stats"
          git switch -C "$branch"
          git add README.md
          git commit -m "docs: actualizar métricas automáticas de contribución"
          git push --force origin "HEAD:$branch"

          existing_pr="$(gh pr list \
            --head "$branch" \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing PR #$existing_pr."
            exit 0
          fi

          if ! gh pr create \
            --base master \
            --head "$branch" \
            --title "docs: actualizar métricas automáticas de contribución" \
            --body $'Actualización automática de las métricas de contribución del README.\n\n- Generado por GitHub Actions.\n- No modifica código de la aplicación.\n- Se integra únicamente mediante Pull Request.'; then
            echo "::warning::La rama de métricas fue actualizada, pero GitHub Actions no tiene permiso para crear Pull Requests. Activa Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
            exit 0
          fi
