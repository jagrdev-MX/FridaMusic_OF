name: PR Checks

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile-foss-debug:
    name: Compile FOSS Debug
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check whitespace errors
        shell: bash
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Compile universal FOSS debug Kotlin
        shell: bash
        run: ./gradlew :app:compileUniversalFossDebugKotlin --no-daemon
